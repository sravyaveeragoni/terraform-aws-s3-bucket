name: Deploy DynamoDB table

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  id-token: write   # OIDC to AWS
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VAR_bucket_name: ${{ vars.BUCKET_NAME }}

jobs:
  deploy:
    name: Apply DynamoDB table
    # Runs only when the PR was merged, not when it was closed without merging
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    concurrency: terraform-apply
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.1

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform apply -input=false -auto-approve -target=aws_dynamodb_table.this -target=aws_dynamodb_table.second
